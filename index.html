<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kokkachhiii 👹</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
.app{position:relative;width:100%;height:100%;background:#050505}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.25),rgba(0,0,0,.75))}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:28px 22px 48px;text-align:center;z-index:3}
.title{font-size:28px;font-weight:800;text-shadow:0 2px 14px #000;margin-bottom:10px}
.sub{font-size:15px;opacity:.9;line-height:1.45;margin-bottom:22px}
.btn{border:1px solid #777;background:rgba(10,10,10,.78);color:#fff;border-radius:999px;padding:15px 25px;font-size:16px;font-weight:800;cursor:pointer}
.hidden{display:none!important}
.formCard{width:min(100%,390px);background:rgba(0,0,0,.82);border:1px solid #444;border-radius:22px;padding:22px}
.formCard h2{margin:0 0 7px;font-size:23px}.formCard p{margin:0 0 18px;font-size:13px;opacity:.8}
.input{width:100%;margin:7px 0;padding:14px;border-radius:12px;border:1px solid #555;background:#111;color:#fff;font-size:15px;outline:none}
.small{font-size:11px;opacity:.6;margin-top:12px;line-height:1.4}.top{position:absolute;top:18px;left:0;right:0;z-index:4;text-align:center;font-weight:900;letter-spacing:2px;text-shadow:0 2px 10px #000}
</style>
</head>
<body>
<div class="app">
<video id="sceneVideo" playsinline preload="auto" muted></video>
<div class="shade"></div>
<div class="top">👹 KOKKACHHIII</div>

<div id="startScreen" class="screen">
<div class="title">👹 കോക്കാച്ചിയുടെ വാതിൽ</div>
<div class="sub">അകത്തേക്ക് വരാൻ ധൈര്യമുണ്ടോ...? 🌫️</div>
<button class="btn" onclick="startExperience()">🚪 DOOR OPEN</button>
</div>

<div id="videoScreen" class="screen hidden">
<button id="nextBtn" class="btn hidden" onclick="nextScene()">👹 മുന്നോട്ട് വരൂ</button>
</div>

<div id="formScreen" class="screen hidden">
<div class="formCard" style="width:min(100%,430px);padding:14px;max-height:88vh;overflow:auto;">
<h2 style="padding:8px 8px 2px;">👹 പേര് പറയൂ</h2>
<p style="padding:0 8px 8px;">കോക്കാച്ചിയുടെ ലിസ്റ്റിൽ പേര് ചേർക്കൂ... 🧺</p>
<iframe src="https://docs.google.com/forms/d/e/1FAIpQLSceo0xezZ-XE4wOX-Lf9pLdIWYET3aUZZqLkoa23YcgE4Zmwg/viewform?embedded=true"
width="100%" height="620" frameborder="0" marginheight="0" marginwidth="0"
style="border:0;border-radius:14px;background:#fff;">Loading…</iframe>
<div class="small" style="padding:8px;">Fun & entertainment purpose മാത്രം. School, address, phone number പോലുള്ള personal details നൽകരുത്.</div>
</div>
</div>

<script>
const videos=["scene1.mp4","scene2.mp4","scene3.mp4"];
let current=0;
const video=document.getElementById("sceneVideo");

function playVideo(i){
 current=i; video.src=videos[i]; video.muted=false; video.currentTime=0;
 video.play().catch(()=>{video.muted=true;video.play();});
}
function startExperience(){
 document.getElementById("startScreen").classList.add("hidden");
 document.getElementById("videoScreen").classList.remove("hidden");
 playVideo(0);
}
video.addEventListener("ended",()=>{
 if(current<videos.length-1) document.getElementById("nextBtn").classList.remove("hidden");
 else{document.getElementById("videoScreen").classList.add("hidden");document.getElementById("formScreen").classList.remove("hidden");}
});
function nextScene(){document.getElementById("nextBtn").classList.add("hidden");playVideo(current+1);}

</script>
</body>
</html>
